name: Build RPM

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - 'codex/**'
    tags:
      - 'v*'
    paths:
      - '.github/workflows/build-rpm.yml'
      - 'packaging/rpm/**'
      - 'PianoTrans.py'
      - 'setup.py'

permissions:
  contents: read

concurrency:
  group: rpm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fedora:
    name: Fedora 44 x86_64
    runs-on: ubuntu-latest
    container:
      image: registry.fedoraproject.org/fedora:44
    timeout-minutes: 360

    steps:
      - name: Install checkout dependency
        run: dnf install -y git-core

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Fedora build dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            rpm-build createrepo_c curl patch tar gzip zstd findutils coreutils \
            pyproject-rpm-macros python3-devel python3-pip python3-setuptools \
            python3-wheel python3-build python3-installer python3-setuptools_scm \
            python3-versioneer \
            gcc gcc-c++ cmake llvm-devel soxr-devel python3-scikit-build-core \
            python3-nanobind python3-packaging python3-numpy

      - name: Cache RPM sources
        uses: actions/cache@v4
        with:
          path: dist/rpmbuild/SOURCES
          key: rpm-sources-${{ hashFiles('packaging/rpm/scripts/fetch-rpm-sources.sh', 'packaging/rpm/patches/*.patch') }}
          restore-keys: rpm-sources-

      - name: Build RPMs
        env:
          INSTALL_AFTER_BUILD: "rpm"
          CREATE_REPO: "1"
          RPMBUILD_OPTS: "--without tests"
        run: packaging/rpm/scripts/build-rpms.sh

      - name: Validate RPM metadata
        run: |
          rpm -qpl dist/rpmbuild/RPMS/noarch/pianotrans-*.rpm
          rpm -qpR dist/rpmbuild/RPMS/noarch/pianotrans-*.rpm
          rpm -qpl dist/rpmbuild/RPMS/noarch/piano-transcription-inference-data-*.rpm |
            grep -F '/usr/share/piano-transcription-inference/note_F1=0.9677_pedal_F1=0.9186.pth'

      - name: Upload RPM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pianotrans-rpms-fedora-44-x86_64
          path: |
            dist/rpmbuild/RPMS/**/*.rpm
            dist/rpmbuild/SRPMS/*.src.rpm
            dist/rpmbuild/RPMS/repodata/**
          if-no-files-found: error
          retention-days: 30
